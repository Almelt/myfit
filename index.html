<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="description" content="自分専用の筋トレ記録アプリ">
  <title>MyFit</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <button id="back" class="icon-btn big-icon" data-action="back" aria-label="戻る" hidden>‹</button>
    <h1 id="title">MyFit</h1>
    <div id="top-actions"></div>
  </header>

  <main id="view"></main>

  <button id="active-bar" data-action="open-active" hidden></button>
  <div id="restbar" hidden></div>

  <nav id="tabbar">
    <button data-action="tab" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>ホーム
    </button>
    <button data-action="tab" data-tab="calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>カレンダー
    </button>
    <button data-action="tab" data-tab="meals">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v18M4 3v5a3 3 0 0 0 6 0V3M18 21V3c-2.5 1-4 4-4 8.5h4"/></svg>食事
    </button>
    <button data-action="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>統計
    </button>
    <button data-action="tab" data-tab="library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>種目
    </button>
  </nav>

  <div id="sheet" data-action="sheet-backdrop" hidden>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
  <div id="toast" role="status"></div>

  <script src="js/exercises.js"></script>
  <script src="js/foods.js"></script>
  <script src="js/store.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
